<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maison Delcourt · ChocoBot</title>
<style>
:root{--cacao:#2b1810;--cacao2:#4a2a1c;--creme:#f6ecdc;--papier:#fbf5ea;--or:#b8893b;--framboise:#a3243b;--ligne:#e4d5bb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--creme);color:var(--cacao);font-family:Georgia,"Times New Roman",serif;
 background-image:radial-gradient(circle at 20% 0%,#fff7e6 0,transparent 45%),repeating-linear-gradient(45deg,transparent 0 22px,rgba(184,137,59,.05) 22px 23px)}
header{background:var(--cacao);color:var(--creme);padding:22px 28px;border-bottom:4px solid var(--or);display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
header h1{margin:0;font-size:1.7rem;letter-spacing:.04em;font-weight:700}
header span{font-style:italic;color:#d9bf8c;font-size:.95rem}
.ghost{margin-left:auto;background:transparent;border:1px solid var(--or);color:var(--creme);padding:7px 14px;border-radius:99px;font:inherit;font-size:.85rem;cursor:pointer}
.ghost:hover{background:var(--or);color:var(--cacao)}
main{max-width:1000px;margin:26px auto;padding:0 16px;display:grid;grid-template-columns:1fr 280px;gap:22px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.box{background:var(--papier);border:1px solid var(--ligne);border-radius:6px;box-shadow:0 6px 22px rgba(43,24,16,.12)}
#chat{display:flex;flex-direction:column;height:calc(100vh - 170px);min-height:460px}
#log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:11px 15px;border-radius:14px;line-height:1.45;font-size:1rem;white-space:pre-wrap}
.bot{background:#fff;border:1px solid var(--ligne);align-self:flex-start;border-bottom-left-radius:3px}
.me{background:var(--cacao2);color:var(--creme);align-self:flex-end;border-bottom-right-radius:3px}
.who{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--or);margin-bottom:3px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--or);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
#chips{padding:0 20px 10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--or);background:transparent;color:var(--cacao2);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:.85rem}
.chip:hover{background:var(--or);color:#fff}
form#send{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--ligne)}
form#send input{flex:1;padding:12px 14px;border:1px solid var(--ligne);border-radius:6px;font:inherit;background:#fff}
button.go{background:var(--framboise);color:#fff;border:0;border-radius:6px;padding:0 20px;font:inherit;font-weight:700;cursor:pointer}
button.go:hover{filter:brightness(1.1)}
aside{padding:20px;align-self:start}
aside h2{margin:0 0 4px;font-size:1.05rem}
aside p{margin:0 0 14px;font-size:.85rem;color:#6b5445;font-style:italic}
aside label{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 3px;color:var(--cacao2)}
button.go:disabled{opacity:.55;cursor:wait}
fieldset{border:0;padding:0;margin:0}
fieldset legend{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--cacao2)}
aside label.allergen{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:normal;font-size:.92rem;margin:9px 0}
aside input[type="checkbox"]{width:16px;height:16px;margin:0;accent-color:var(--framboise)}
</style>
</head>
<body>
<header><h1>MAISON DELCOURT</h1><span>Chocolatier artisanal · Lille</span><button id="reset" class="ghost">Nouvelle conversation</button></header>
<main>
 <section id="chat" class="box">
  <div id="log"></div>
  <div id="chips">
   <button class="chip">Un coffret à 30 euros</button>
   <button class="chip">Un cadeau pour des enfants</button>
   <button class="chip">Du chocolat noir intense</button>
   <button class="chip">Quels sont vos horaires ?</button>
   <button class="chip">Livraison ?</button>
  </div>
  <form id="send"><input id="msg" autocomplete="off" placeholder="Écrivez votre message…" required><button class="go" id="go">Envoyer</button></form>
 </section>
 <aside class="box">
  <h2>Pour mieux vous conseiller</h2>
  <p>Les allergènes cochés servent uniquement à filtrer les coffrets proposés. Ils ne sont pas enregistrés.</p>
  <fieldset>
   <legend>Allergènes à éviter</legend>
   <label class="allergen"><input type="checkbox" name="allergies" value="lait"> Lait</label>
   <label class="allergen"><input type="checkbox" name="allergies" value="fruits à coque"> Fruits à coque</label>
   <label class="allergen"><input type="checkbox" name="allergies" value="soja"> Soja</label>
   <label class="allergen"><input type="checkbox" name="allergies" value="gluten"> Gluten</label>
   <label class="allergen"><input type="checkbox" name="allergies" value="œufs"> Œufs</label>
   <label class="allergen"><input type="checkbox" name="allergies" value="arachides"> Arachides</label>
  </fieldset>
 </aside>
</main>
<script>
const log = document.getElementById("log");
const el = id => document.getElementById(id);
let sid = localStorage.sid || (localStorage.sid = crypto.randomUUID());
let busy = false;
const selectedAllergies = () => [...document.querySelectorAll('input[name="allergies"]:checked')].map(input => input.value);

function add(text, who){
  const d = document.createElement("div"); d.className = "msg " + who;
  d.innerHTML = '<div class="who">' + (who === "bot" ? "Clémence · Maison Delcourt" : "Vous") + "</div>";
  const t = document.createElement("div"); t.textContent = text; d.appendChild(t);
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function welcome(){
  add("Bonjour, je suis Clémence, votre assistante IA à la Maison Delcourt. Pour quelle occasion cherchez-vous des chocolats ?", "bot");
}
async function post(path, payload){
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function send(text){
  if (busy) return;
  busy = true; el("go").disabled = true;
  add(text, "me");
  const wait = add("", "bot");
  wait.lastChild.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  try {
    wait.lastChild.textContent = (await post("/chat", {
      session_id: sid, message: text, allergies: selectedAllergies()
    })).reply;
  } catch (e) {
    wait.lastChild.textContent = "Désolé, une erreur est survenue.";
  }
  busy = false; el("go").disabled = false; el("msg").focus();
  log.scrollTop = log.scrollHeight;
}
el("send").onsubmit = e => {
  e.preventDefault();
  const i = el("msg");
  if (i.value.trim()) { send(i.value.trim()); i.value = ""; }
};
document.querySelectorAll(".chip").forEach(c => c.onclick = () => send(c.textContent));

el("reset").onclick = () => {
  sid = localStorage.sid = crypto.randomUUID();
  log.innerHTML = "";
  document.querySelectorAll('input[name="allergies"]').forEach(input => { input.checked = false; });
  welcome();
};
welcome();
</script>
</body>
</html>
